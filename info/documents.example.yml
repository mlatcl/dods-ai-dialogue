# Copy to documents.yml (gitignored) and fill from the private store.
# filename is relative to ../files.
#
# Scheme: kebab-case inside a field, underscores between fields,
# general → specific left to right.
#   {format}_{round}_{session}.docx
#   {format}_{round}_{session}_{facilitator}.docx
# Facilitator is omitted on chatbot files. Workshop facilitator is an
# opaque id (f01, f02, …); the name map lives in ../local.yml.
# Do not put facilitator names or original Recollective titles in git.

- Name: chatbot_autumn-2025_recollective
  title: chatbot_autumn-2025_recollective
  filename: chatbot/chatbot_autumn-2025_recollective.docx
  reader: docx
  strategy: docx_chatbot.v1
  year: 2025
  technology: ai-local-government
  format: chatbot
  group: chatbot
  round: autumn_2025
  session_type: chatbot

