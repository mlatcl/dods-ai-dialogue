# CIP-0023 / CIP-0024 — multiverse picker overlay (not the graph).
# Topology comes from declared interface stores on stage frontmatter
# (referia compose_pipeline_manifest / discover_pipeline_edges).
# Nodes below supply titles, permalinks, cost classes, and paper axes.
nodes:
  - id: 01_chunk
    permalink: /01_chunk/
    title: Catalog & segment
    parameters_path: _data/01_chunk/parameters.yml
    parameters:
      - key: min_chunk_words
        cost_class: display
        multiverse_eligible: false
      - key: workshop_chunk_words
        cost_class: refit
        multiverse_eligible: true
      - key: workshop_max_words
        cost_class: refit
        multiverse_eligible: true

  - id: 01_turns
    permalink: /01_turns/
    title: Speaker turns
    parameters_path: _data/01_turns/parameters.yml
    parameters:
      - key: labelled_min_share
        cost_class: display
        multiverse_eligible: false

  - id: 02_extract
    permalink: /02_extract/
    title: Extract phrases
    parameters_path: _data/02_extract/parameters.yml
    parameters:
      - key: quote_support_threshold
        cost_class: aggregate
        multiverse_eligible: true
        paper_axis: thresholds
        label: Quote-support threshold (paper axis)
      - key: extract_model
        cost_class: llm
        multiverse_eligible: true
      - key: extract_max_items
        cost_class: llm
        multiverse_eligible: true

  - id: 02_embed
    permalink: /02_embed/
    title: Embed & pack
    parameters_path: _data/02_embed/parameters.yml
    parameters:
      - key: embed_model
        cost_class: llm
        multiverse_eligible: true

  - id: 03_vq
    permalink: /03_vq/
    title: Vector quantisation
    parameters_path: _data/03_vq/parameters.yml
    parameters:
      - key: n_vq
        cost_class: refit
        multiverse_eligible: true
        label: Codebook size (refit 03→04→06)
      - key: vq_walk_speed
        cost_class: display
        multiverse_eligible: false

  - id: 04_grain
    permalink: /04_grain/
    title: Lenses
    parameters_path: _data/04_grain/parameters.yml
    parameters:
      - key: n_clusters
        cost_class: refit
        multiverse_eligible: true
      - key: cluster_method
        cost_class: refit
        multiverse_eligible: true

  - id: 05_distance
    permalink: /05_distance/
    title: EMD / MDS (extra)
    parameters_path: _data/05_distance/parameters.yml
    parameters:
      - key: n_perm
        cost_class: display
        multiverse_eligible: false

  - id: 06_compare
    permalink: /06_compare/
    title: Part A shares
    parameters_path: _data/06_compare/parameters.yml
    parameters:
      - key: n_boot
        cost_class: aggregate
        multiverse_eligible: true
      - key: min_gap
        cost_class: aggregate
        multiverse_eligible: true

  - id: 07_grounds
    permalink: /07_grounds/
    title: Basis coding
    parameters_path: _data/07_grounds/parameters.yml
    parameters:
      - key: grounds_model
        cost_class: llm
        multiverse_eligible: true

  - id: 07_part_b
    permalink: /07_part_b/
    title: Part B shares
    parameters_path: _data/07_part_b/parameters.yml
    parameters:
      - key: experience_bases
        cost_class: aggregate
        multiverse_eligible: true
        paper_axis: definitions
      - key: n_boot
        cost_class: aggregate
        multiverse_eligible: true
      - key: min_gap
        cost_class: aggregate
        multiverse_eligible: true

  - id: 08_questions
    permalink: /08_questions/
    title: Question-type stress
    parameters_path: _data/08_questions/parameters.yml
    parameters: []

  - id: 09_validate
    permalink: /09_validate/
    title: Word-list floor
    parameters_path: _data/09_validate/parameters.yml
    parameters: []

  - id: 10_sequence
    permalink: /10_sequence/
    title: Stories-follow-stories
    parameters_path: _data/10_sequence/parameters.yml
    parameters: []

  - id: 11_multiverse
    permalink: /11_multiverse/
    title: Analysis-choice product
    parameters_path: _data/11_multiverse/parameters.yml
    parameters:
      - key: axis_definitions
        cost_class: aggregate
        multiverse_eligible: true
        paper_axis: definitions
      - key: axis_weightings
        cost_class: aggregate
        multiverse_eligible: true
        paper_axis: weightings
      - key: axis_exclusions
        cost_class: aggregate
        multiverse_eligible: true
        paper_axis: exclusions
      - key: axis_thresholds
        cost_class: aggregate
        multiverse_eligible: true
        paper_axis: thresholds
      - key: axis_rounds
        cost_class: aggregate
        multiverse_eligible: true
        paper_axis: rounds
